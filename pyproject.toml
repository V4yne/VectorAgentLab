[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector_agent_lab"
version = "0.1.0"
description = "A learning-first Agent framework skeleton."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "VectorAgentLab contributors" }
]
dependencies = [
  "python-dotenv>=1.0",
  "requests>=2.31"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0"
]
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27"
]

[project.scripts]
vector-agent-lab-web = "vector_agent_lab.web.app:main"
vector-agent-lab-web-start = "vector_agent_lab.web.cli:start_main"
vector-agent-lab-web-stop = "vector_agent_lab.web.cli:stop_main"

[tool.setuptools.packages.find]
include = ["vector_agent_lab*"]

[tool.setuptools.package-data]
vector_agent_lab = ["web/static/*.html", "web/static/*.css", "web/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["vector_agent_lab/tests"]
pythonpath = ["."]
