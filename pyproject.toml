[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector_agent_lab"
version = "0.1.0"
description = "A learning-first Agent framework skeleton."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "VectorAgentLab contributors" }
]
dependencies = [
  "python-dotenv>=1.0",
  "requests>=2.31"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.setuptools.packages.find]
include = ["vector_agent_lab*"]

[tool.pytest.ini_options]
testpaths = ["vector_agent_lab/tests"]
pythonpath = ["."]
